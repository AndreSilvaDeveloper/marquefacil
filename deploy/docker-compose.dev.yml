# Marque Fácil — AMBIENTE DE TESTES (branch dev) na máquina nd2.
# Domínios: dev.maquefacil.com.br e dev.studiokadosh.com. A produção (branch main) está em docker-compose.prod.yml.
#
# Tudo separado da produção: pasta /opt/marquefacil-dev, projeto "marquefacil-dev", containers,
# volumes (banco próprio, começa vazio) e redes com prefixo "marquefacil-dev". Evolution própria:
# o WhatsApp conectado aqui não tem nada a ver com o da produção.
#
# Redes:
#  - marquefacil-dev      → só o app. O Caddy entra nesta rede e chama `marquefacil-dev-app:3000`.
#  - marquefacil-dev-wa   → app ↔ Evolution (e a Evolution sai para a internet por ela). O Caddy não entra.
#  - marquefacil-dev-db   → Evolution ↔ banco dela (interna, sem internet).
# Portas só no 127.0.0.1 (teste de fumaça e diagnóstico por túnel SSH).
name: marquefacil-dev

services:
  marquefacil-dev-app:
    image: marquefacil-app:dev
    container_name: marquefacil-dev-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT:-3110}:3000"
    volumes:
      - marquefacil-dev-data:/data
    networks:
      - marquefacil-dev
      - marquefacil-dev-wa
    mem_limit: 384m
    cpus: 0.5
    logging: &logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  marquefacil-dev-evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: marquefacil-dev-evolution
    restart: unless-stopped
    env_file: .env.evolution     # AUTHENTICATION_API_KEY, EVOLUTION_DB_PASSWORD
    environment:
      SERVER_URL: http://marquefacil-dev-evolution:8080
      SERVER_PORT: "8080"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@marquefacil-dev-evolution-db:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: marquefacil-dev
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      CONFIG_SESSION_PHONE_CLIENT: Marque Facil Dev
      CONFIG_SESSION_PHONE_NAME: Chrome
      DEL_INSTANCE: "false"
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN
      LOG_BAILEYS: error
      LANGUAGE: pt-BR
    ports:
      - "127.0.0.1:${EVOLUTION_PORT:-3111}:8080"
    volumes:
      - marquefacil-dev-evolution-instances:/evolution/instances
    networks:
      - marquefacil-dev-wa
      - marquefacil-dev-db
    depends_on:
      marquefacil-dev-evolution-db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5
    logging: *logging

  marquefacil-dev-evolution-db:
    image: postgres:16-alpine
    container_name: marquefacil-dev-evolution-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - marquefacil-dev-evolution-db:/var/lib/postgresql/data
    networks:
      - marquefacil-dev-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 192m
    cpus: 0.3
    logging: *logging

volumes:
  marquefacil-dev-data:
    name: marquefacil-dev-data
  marquefacil-dev-evolution-instances:
    name: marquefacil-dev-evolution-instances
  marquefacil-dev-evolution-db:
    name: marquefacil-dev-evolution-db

networks:
  marquefacil-dev:
    name: marquefacil-dev
  marquefacil-dev-wa:
    name: marquefacil-dev-wa
  marquefacil-dev-db:
    name: marquefacil-dev-db
    internal: true
