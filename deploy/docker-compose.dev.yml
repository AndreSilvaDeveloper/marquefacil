# Marque Fácil no servidor de dev (máquina nd2, compartilhada com WorkID, zenfra, vault…).
#
# Regras desta máquina:
#  - o HTTPS é do container `caddy` (/var/www/caddy). Ele entra na rede de cada app e
#    chama o container pelo nome — aqui: `marquefacil-app:3000`, na rede `marquefacil`;
#  - o serviço NÃO pode se chamar "app": o Caddy já usa `app:3000` para o vault, e o nome
#    repetido numa rede que ele enxerga poderia desviar o tráfego;
#  - nomes com prefixo "marquefacil-", limite de memória/CPU;
#  - a porta 3100 fica só no 127.0.0.1 (teste de fumaça e diagnóstico).
#
# O workflow copia este arquivo para /opt/marquefacil/docker-compose.yml e gera o .env ao lado.
name: marquefacil

services:
  marquefacil:
    image: marquefacil-app:dev
    container_name: marquefacil-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    volumes:
      - marquefacil-data:/data   # banco SQLite + cópias diárias em /data/backups
    networks:
      - marquefacil
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  marquefacil-data:
    name: marquefacil-data

networks:
  marquefacil:
    name: marquefacil
