<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8e3a6b">
  <title>Agendar horário</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { padding-bottom: 2rem; }
    .step { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem; }
    .step h2 { margin: 0 0 .8rem; display: flex; gap: .5rem; align-items: center; }
    .step h2 .n { background: var(--brand); color: #fff; border-radius: 50%; width: 1.8rem; height: 1.8rem; display: inline-grid; place-items: center; font-size: .95rem; }
    .step.done h2 .n { background: var(--ok); }
    .pick { display: grid; gap: .5rem; }
    .pick button {
      text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 12px;
      padding: .8rem 1rem; min-height: 3.2rem; font-weight: 700; cursor: pointer;
    }
    .pick button small { display: block; font-weight: 400; color: var(--muted); }
    .pick button.on { border-color: var(--brand); background: var(--brand-soft); }
    .pick button small.from { color: var(--brand); font-weight: 700; margin-top: .15rem; }
    .pick button { position: relative; padding-right: 2.8rem; }
    .pick button .tick { position: absolute; right: .8rem; top: 50%; transform: translateY(-50%); width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .95rem; color: #fff; }
    .pick button.on .tick { background: var(--brand); border-color: var(--brand); }
    #svc-go:disabled { opacity: .5; }
    /* calendário do mês */
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .6rem; }
    .cal-head b { font-size: 1.15rem; }
    .cal-nav { width: 3rem; height: 3rem; border-radius: 50%; border: 2px solid var(--line); background: #fff; font-size: 1.5rem; font-weight: 700; color: var(--brand); cursor: pointer; }
    .cal-nav:disabled { opacity: .3; cursor: default; }
    .cal { margin: 0 -.7rem; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: .2rem; }
    .cal-week span { text-align: center; font-size: .8rem; font-weight: 700; color: var(--muted); padding-bottom: .2rem; }
    .cal-grid > * { min-width: 0; }
    #cal button {
      width: 100%; aspect-ratio: 1; padding: 0; border-radius: 12px; border: 2px solid var(--brand); background: var(--brand-soft);
      color: var(--ink); font-size: 1.1rem; font-weight: 800; cursor: pointer;
    }
    #cal button:disabled { border-color: transparent; background: none; color: #c9c0c4; font-weight: 400; cursor: default; }
    #cal button.today:not(:disabled) { box-shadow: inset 0 0 0 2px #fff; }
    #cal button.on { background: var(--brand); color: #fff; }
    /* progresso e o que já foi escolhido */
    .progress { display: flex; gap: .35rem; margin-bottom: .8rem; }
    .progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
    .progress i.on { background: var(--brand); }
    .picked { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .8rem; }
    .picked button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: .45rem .8rem; font-weight: 600; cursor: pointer; }
    .picked button span { color: var(--brand); font-size: .8rem; margin-left: .3rem; text-decoration: underline; }
    .times { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.2rem, 1fr)); gap: .45rem; }
    .times button { border: 2px solid var(--line); background: #fff; border-radius: 12px; min-height: 3rem; font-weight: 800; font-size: 1.05rem; cursor: pointer; }
    .times button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
    .summary { background: var(--brand-soft); border-radius: 12px; padding: .8rem 1rem; margin-bottom: 1rem; }
    .hp { position: absolute; left: -5000px; }
    .meu { margin-bottom: .8rem; }
    .pbar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin: .5rem 0 .3rem; }
    .pbar i { display: block; height: 100%; background: var(--ok); }
    .meu p { margin: .2rem 0; }
    .big-when { font-size: 1.15rem; }
    .moving { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: .5rem .7rem; font-weight: 600; font-size: .92rem; }
    .price-note { margin: 1rem 0 0; padding: .7rem .9rem; border-radius: 12px; background: var(--brand-soft); font-size: .95rem; }
    .ok-box { text-align: center; padding: 1.5rem 1rem; }
    .ok-box .big { font-size: 3rem; }
    /* pagar pelo banco */
    .payitem { border-left: 4px solid var(--warn); }
    .payitem .opts { display: grid; gap: .45rem; margin-top: .7rem; }
    .payitem .opts button { display: flex; justify-content: space-between; align-items: center; gap: .6rem; text-align: left; }
    .payitem .opts button b { white-space: nowrap; }
    .paybox { text-align: center; }
    .paybox .val { font-size: 2rem; font-weight: 800; margin: .2rem 0 .6rem; }
    .paybox img { width: min(240px, 70vw); aspect-ratio: 1; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 12px; }
    .paybox textarea { width: 100%; font-size: .8rem; word-break: break-all; min-height: 4.5rem; resize: none; margin-top: .6rem; }
    .paywait { margin-top: 1rem; padding: .7rem; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-weight: 700; }
    .paywait.ok { background: var(--ok-soft, #e6f4ea); color: var(--ok); }
    .hist { display: grid; gap: 0; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .hist > div { display: flex; gap: .7rem; align-items: center; padding: .65rem .9rem; border-top: 1px solid var(--line); }
    .hist > div:first-child { border-top: 0; }
    .hist .d { color: var(--muted); font-size: .88rem; min-width: 3rem; }
    .hist .w { flex: 1; min-width: 0; }
    .hist .v { text-align: right; white-space: nowrap; font-weight: 700; }
    .hist .v small { display: block; font-weight: 600; font-size: .78rem; }
    .hist .more { justify-content: center; color: var(--brand); font-weight: 700; cursor: pointer; background: none; border: 0; border-top: 1px solid var(--line); width: 100%; padding: .7rem; }
    .htabs { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; margin-bottom: .6rem; }
    .htabs button { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: .5rem; font-weight: 700; cursor: pointer; }
    .htabs button.on { border-color: var(--brand); background: var(--brand-soft); }
  </style>
</head>
<body>
  <header id="top"><h1 id="title">Agendar horário</h1></header>
  <main id="app"><div class="empty">Carregando…</div></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/agendar.js"></script>
</body>
</html>
