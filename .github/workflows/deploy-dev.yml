name: Deploy dev

# AMBIENTE DE TESTES (dev.maquefacil.com.br, dev.studiokadosh.com), separado da produção.
# Sai sozinho a cada push no branch dev (ou manual: Actions → "Deploy dev" → Run workflow, branch dev).
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Só do branch dev
        if: github.ref != 'refs/heads/dev'
        run: |
          echo "::error::O ambiente dev só sai do branch dev (veio de ${{ github.ref }})"
          exit 1
      - run: echo "OK, branch dev"
  deploy:
    needs: check
    uses: ./.github/workflows/deploy.yml
    with:
      env: dev
      app_dir: /opt/marquefacil-dev
      compose_file: deploy/docker-compose.dev.yml
      project: marquefacil-dev
      app_container: marquefacil-dev-app
      evo_container: marquefacil-dev-evolution
      app_port: '3110'
      evo_port: '3111'
      domain: ${{ vars.DEV_DOMAIN || 'dev.maquefacil.com.br' }}
      allow_signup: 'true'
